[package]
name = "rustc_codegen_rakit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# These have to be in sync with each other
rakit-codegen = { path = "vendor/rakit-codegen", version = "0.137.0", default-features = false, features = ["std", "timing", "unwind", "all-native-arch"] }
rakit-frontend = { path = "vendor/rakit-frontend", version = "0.137.0" }
rakit-module = { path = "vendor/rakit-module", version = "0.137.0" }
rakit-native = { path = "vendor/rakit-native", version = "0.137.0" }
rakit-jit = { path = "vendor/rakit-jit", version = "0.137.0", optional = true }
rakit-object = { path = "vendor/rakit-object", version = "0.137.0", default-features = false }
rakit-opt = { path = "rakit-opt" }
target-lexicon = "0.13"
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.40.0", default-features = false, features = ["std", "read_core", "write", "archive", "coff", "elf", "macho", "pe"] }

indexmap = "2.0.0"
libloading = { version = "0.9.0", optional = true }
smallvec = "1.8.1"

# Uncomment to use an unreleased version of rakit
#[patch.crates-io]
#rakit-codegen = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#rakit-frontend = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#rakit-module = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#rakit-native = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#rakit-jit = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#rakit-object = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }

# Uncomment to use local checkout of rakit
#rakit-codegen = { path = "../wasmtime/rakit/codegen" }
#rakit-frontend = { path = "../wasmtime/rakit/frontend" }
#rakit-module = { path = "../wasmtime/rakit/module" }
#rakit-native = { path = "../wasmtime/rakit/native" }
#rakit-jit = { path = "../wasmtime/rakit/jit" }
#rakit-object = { path = "../wasmtime/rakit/object" }

# Local modifications to rakit-object: emit each function into a uniquely
# named section so that `--gc-sections` can discard dead code (see vendor/).
#
# Local modifications to rakit-codegen: remap the external names inside
# `GlobalValueData::Symbol` when inlining, so callees that reference a
# const/static can be inlined instead of being forced out of line (see vendor/).
# The crates under vendor/ are wired in as path dependencies above, so no
# [patch.crates-io] entry is needed.

#gimli = { path = "../" }

[features]
# Enable features not ready to be enabled when compiling as part of rustc
unstable-features = ["jit", "inline_asm_sym"]
jit = ["rakit-jit", "libloading"]
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
