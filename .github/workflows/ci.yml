name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path compiler/Cargo.toml

      # Front-end and codegen unit tests; no `as`/`ld` needed.
      - name: Unit tests
        run: cargo test --manifest-path compiler/Cargo.toml

      # Differential suite: compile every case with rmc and rustc, run both, and
      # require identical stdout and exit status. Needs binutils (as/ld).
      - name: Differential tests
        run: python3 tests/run.py

      # The MIR pipeline (rustc front end + rmc back end): same differential
      # contract, but the reference and the subject share one freestanding
      # runtime, so the only variable is the code generator. `rmc` drives
      # `rustc --emit=mir` itself (with `RUSTC_BOOTSTRAP=1` for `-Zno-codegen`),
      # so the stable toolchain installed above is enough.
      - name: MIR differential tests
        run: python3 tests/mir/run.py

      # Realistic Rust through the MIR back end must produce a clean error or a
      # working binary, never a panic or a signal. The suite above only feeds
      # the back end programs it is known to support; this reaches the
      # diagnostics path a user typing arbitrary Rust actually hits.
      - name: MIR crash survey
        run: python3 tools/mir_survey.py

  # The real codegen-backend pipeline. `test` above runs on stable and so only
  # covers the printed-MIR prototype; this job installs the nightly `rustc-dev`
  # component, builds the backend dylib, and runs the differential suite that
  # drives `-Zcodegen-backend` for real. That is the only place the backend's
  # defining-path MIR rendering (vs the prototype's visible paths) is exercised.
  cb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly
        # The channel comes from `backend/rust-toolchain.toml`, so the toolchain
        # the backend links against is the one CI tests against. `rustc-dev` for
        # the backend dylib, `llvm-tools`/`rustc-codegen-cranelift` for the
        # benches below.
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' backend/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustc-dev --component llvm-tools \
            --component rustc-codegen-cranelift

      - name: Build compiler
        run: cargo build --release --manifest-path compiler/Cargo.toml

      - name: Build backend
        run: ./backend/build.sh

      - name: Codegen-backend differential tests
        run: python3 tests/cb/run.py

  # The benchmark harnesses must run on a fresh machine with only the README's
  # steps: this is where their toolchain independence (no hard-coded mangled
  # symbol names) is checked, since a hard-coded spelling only breaks on a
  # toolchain other than the author's.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' backend/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustc-dev --component llvm-tools \
            --component rustc-codegen-cranelift

      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Build compiler and example
        run: cargo build --release --manifest-path compiler/Cargo.toml --example rmcmir

      - name: Build backend
        run: ./backend/build.sh

      # One source, two back ends, from an empty output directory: the harness
      # must create its own directories and discover the panic symbols itself.
      - name: Fair benchmark (must complete)
        run: python3 bench/run_fair.py

      - name: Four-way benchmark (must complete)
        run: python3 bench/run_four.py

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path compiler/Cargo.toml

      # Malformed and adversarial input must produce a clean error, never a
      # panic or a signal. This is the check that catches an unbounded parser
      # recursion overflowing the stack on untrusted input. It needs no rustc.
      - name: Robustness (malformed input must not crash)
        run: python3 tools/fuzz.py --mode robust

      # Programs rustc rejects must be rejected by rmc too. This catches the
      # soundness class the differential run cannot see: a program rmc wrongly
      # accepts is never run against the reference, because it does not compile.
      - name: Rejection parity (rustc-rejected programs)
        run: python3 tools/fuzz.py --mode reject

      # Mutation fuzzing: random edits to valid programs, every mutant must
      # fail cleanly. Needs no rustc, and reaches error paths the fixed
      # `robust` corpus does not.
      - name: Mutation fuzz (malformed input must not crash)
        run: |
          python3 tools/fuzz.py --mode mutate --n 400 --seed 1
          python3 tools/fuzz.py --mode mutate --n 400 --seed 2

      # A bounded differential fuzz run, so a divergence found by random
      # generation fails CI rather than only failing when someone runs it by
      # hand. Small and fixed-seed: reproducible, and fast enough to gate.
      - name: Differential fuzz (bounded)
        run: |
          python3 tools/fuzz.py --mode expr --n 400 --seed 1
          python3 tools/fuzz.py --mode expr --n 400 --seed 2
          python3 tools/fuzz.py --mode stmt --n 400 --seed 1
          python3 tools/fuzz.py --mode stmt --n 400 --seed 2
          python3 tools/fuzz.py --mode shift --n 400 --seed 1
          python3 tools/fuzz.py --mode patshadow --n 400 --seed 1
          python3 tools/fuzz.py --mode patshadow --n 400 --seed 2
          python3 tools/fuzz.py --mode semi --n 400 --seed 1
          python3 tools/fuzz.py --mode semi --n 400 --seed 2
          python3 tools/fuzz.py --mode boolbit --n 400 --seed 1
          python3 tools/fuzz.py --mode boolbit --n 400 --seed 2
          python3 tools/fuzz.py --mode vis --n 400 --seed 1
          python3 tools/fuzz.py --mode vis --n 400 --seed 2
