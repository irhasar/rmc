[package]
name = "nrc"
version = "0.1.0"
edition = "2021"
description = "nrc: an experimental Rust-subset compiler that emits native x86-64 machine code directly, with no LLVM and zero external crates."

[[bin]]
name = "nrc"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
